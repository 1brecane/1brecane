name: Generate profile art

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "5 23 * * *" # just after midnight in Rome in winter, so the day's body turns over on time
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4

      - name: Check out the portfolio, whose scene code draws the hero
        uses: actions/checkout@v4
        with:
          repository: 1brecane/portfolio
          ref: main
          path: portfolio

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the generator against the portfolio
        run: node --test "scripts/*.test.ts"
        env:
          PORTFOLIO_DIR: portfolio

      - name: Generate the day's celestial body
        run: node scripts/generate.ts portfolio dist

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PAT_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7d6b47
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8d096

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
